<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Scryfall Art Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" media="screen" href="css/main.css">
</head>
<body>

  <div id="app" v-bind:class="{ 'theme-dark': darkTheme, 'theme-light': !darkTheme }">
    <div class="spacer" aria-hidden="true"></div>

    <div role="main" class="screen difficulty" v-if="!started">
      <h1>Scryfall Art Game</h1>
      <p>Which format's cards should show up?</p>
      
      <div class="difficulty-buttons">
        <button type="button" class="button-lg" @click="start('standard')" ref="standardBtn">Standard</button>
        <button type="button" class="button-lg" @click="start('modern')">Modern</button>
        <button type="button" class="button-lg" @click="start('vintage')">Vintage</button>
      </div>
    </div>

    <div role="main" class="screen game" v-show="started">
      <!-- todo: handle artUrl not yet available -->
      <img class="art" v-bind:src="artUrl">

      <p>Which card is this?</p>

      <form @submit.prevent="check">
        <input type="text" ref="guessInput" class="guess" v-model="guess">
        <button type="submit" class="vh">Check</button>
      </form>
    </div>

    <footer>
      <div class="credit">
        by <a href="https://github.com/spacemonaut" target="_blank">spacemonaut</a>, based on the MagicCards.info Art Game
      </div>
      <div class="controls">
        <span>Theme:</span>
        <button type="button" class="button-sm" @click="toggleTheme">
          {{ darkTheme ? 'Dark' : 'Light' }}
        </button>
      </div>
    </footer>
  </div>
  
  <script src="js/lib/vue.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
